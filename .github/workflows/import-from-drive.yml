name: Import World Ferns from Google Drive

# Triggered by Google Apps Script when a new WorldFerns file is uploaded
# to the shared Drive folder.
on:
  repository_dispatch:
    types: [worldferns_updated]
  workflow_dispatch:
    inputs:
      file_id:
        description: >-
          Google Drive file ID to download. Leave blank to auto-discover
          the newest WorldFerns_ver_*.csv in the shared Drive folder.
        required: false
        type: string
      file_name:
        description: "Filename to save as in data_raw (required if file_id is set)"
        required: false
        type: string

# Prevent two runs processing the same update simultaneously.
concurrency:
  group: import-world-ferns
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Download input and run targets pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # renv cache path - speeds up package restoration
      RENV_PATHS_CACHE: ~/.local/share/renv

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up R
      # ------------------------------------------------------------------ #
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      # ------------------------------------------------------------------ #
      # 3. Install system dependencies required by some R packages
      # ------------------------------------------------------------------ #
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk40 \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Install gnparser
        run: |
          GN_URL="$(curl -s \
            https://api.github.com/repos/gnames/gnparser/releases/latest \
            | grep -o 'https://[^\"]*gnparser-v[0-9.]*-linux-x86.tar.gz' \
            | head -n 1)"

          if [ -z "$GN_URL" ]; then
            echo "Could not resolve gnparser download URL."
            exit 1
          fi

          curl -L "$GN_URL" -o /tmp/gnparser.tar.gz
          tar -xzf /tmp/gnparser.tar.gz -C /tmp
          sudo mv /tmp/gnparser /usr/local/bin/gnparser
          gnparser -V

      # ------------------------------------------------------------------ #
      # 4. Restore renv cache and packages
      # ------------------------------------------------------------------ #
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Restore renv library
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) {
            install.packages("renv")
          }
          renv::restore(prompt = FALSE)

      # ------------------------------------------------------------------ #
      # 5. Create required directories
      # ------------------------------------------------------------------ #
      - name: Create data directories
        run: |
          mkdir -p _targets/user/data_raw
          mkdir -p _targets/user/results

      # ------------------------------------------------------------------ #
      # 6. Download World Ferns input file from Google Drive
      #
      # The dispatch payload (from Apps Script) or manual-dispatch inputs
      # supply the Drive file ID and file name. If neither is given (manual
      # dispatch with file_id left blank), the newest WorldFerns_ver_*.csv
      # in the shared Drive folder is auto-discovered and downloaded
      # instead. The file is saved with its original name so
      # tar_file_read() change-detection still works correctly.
      # ------------------------------------------------------------------ #
      - name: Resolve Drive file ID
        id: resolve_id
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FILE_ID="${{ github.event.client_payload.file_id }}"
            FILE_NAME="${{ github.event.client_payload.file_name }}"
            if [ -z "$FILE_ID" ] || [ -z "$FILE_NAME" ]; then
              echo "repository_dispatch payload is missing file_id or file_name."
              exit 1
            fi
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
            echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.file_id }}" ]; then
            FILE_ID="${{ inputs.file_id }}"
            FILE_NAME="${{ inputs.file_name }}"
            if [ -z "$FILE_NAME" ]; then
              echo "file_name is required when file_id is provided."
              exit 1
            fi
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
            echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "No file_id provided; auto-discovering newest Drive file."
            echo "auto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download input file from Google Drive
        id: download_input
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          WF_DRIVE_FOLDER_ID: ${{ secrets.WF_DRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "Actions secret GDRIVE_SA_KEY is required for private Drive downloads."
            exit 1
          fi

          printf '%s' "$GDRIVE_SA_KEY" > _targets/user/data_raw/gdrive-sa-key.json
          pip install --quiet google-api-python-client google-auth

          if [ "${{ steps.resolve_id.outputs.auto }}" = "true" ]; then
            if [ -z "$WF_DRIVE_FOLDER_ID" ]; then
              echo "Actions secret WF_DRIVE_FOLDER_ID is required to auto-discover the input file."
              rm -f _targets/user/data_raw/gdrive-sa-key.json
              exit 1
            fi
            RESOLVED="$(python scripts/download_worldferns_file_from_drive.py \
              --folder-id "$WF_DRIVE_FOLDER_ID" \
              --out-dir _targets/user/data_raw \
              --credentials _targets/user/data_raw/gdrive-sa-key.json)"
          else
            RESOLVED="$(python scripts/download_worldferns_file_from_drive.py \
              --file-id "${{ steps.resolve_id.outputs.file_id }}" \
              --file-name "${{ steps.resolve_id.outputs.file_name }}" \
              --out-dir _targets/user/data_raw \
              --credentials _targets/user/data_raw/gdrive-sa-key.json)"
          fi
          rm -f _targets/user/data_raw/gdrive-sa-key.json

          echo "$RESOLVED"
          FILE_ID="$(echo "$RESOLVED" | grep '^file_id=' | cut -d= -f2-)"
          FILE_NAME="$(echo "$RESOLVED" | grep '^file_name=' | cut -d= -f2-)"
          if [ -z "$FILE_ID" ] || [ -z "$FILE_NAME" ]; then
            echo "Download script did not report a resolved file_id/file_name."
            exit 1
          fi
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 7. Set WORLD_FERNS_INPUT (resolve_wf_input() will read this)
      # ------------------------------------------------------------------ #
      - name: Set WORLD_FERNS_INPUT environment variable
        run: |
          FILE_NAME="${{ steps.download_input.outputs.file_name }}"
          echo "WORLD_FERNS_INPUT=_targets/user/data_raw/$FILE_NAME" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # 8. Write job summary: trigger metadata
      # ------------------------------------------------------------------ #
      - name: Write trigger summary
        run: |
          echo "## Import run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| Auto-discovered from Drive folder | \
           ${{ steps.resolve_id.outputs.auto || 'false' }} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| Drive file ID | \
           ${{ steps.download_input.outputs.file_id }} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| Drive filename | \
           ${{ steps.download_input.outputs.file_name }} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| Run started | $(date -u '+%Y-%m-%d %H:%M UTC') |" \
            >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------ #
      # 9. Run targets pipeline
      # ------------------------------------------------------------------ #
      - name: Run tar_make()
        shell: Rscript {0}
        env:
          TAR_PROJECT: main
        run: |
          source("R/packages.R")
          targets::tar_make()

      - name: Upload wf_ppg_genus_plus.csv artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wf-ppg-genus-plus-csv
          path: _targets/user/results/wf_ppg_genus_plus.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Upload wf_ppg_data_versions.csv artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wf-ppg-data-versions-csv
          path: _targets/user/results/wf_ppg_data_versions.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Upload targets run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targets-meta
          path: _targets/meta/
          retention-days: 30
          if-no-files-found: ignore
