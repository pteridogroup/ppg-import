name: Deploy Shiny app to shinyapps.io

on:
  workflow_run:
    workflows: ["Import World Ferns from Google Drive"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-shinyapps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ppg-wf-explorer
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RENV_PATHS_CACHE: ~/.local/share/renv
      SHINYAPPS_ACCOUNT: pteridogroup
      SHINYAPPS_APP_NAME: ppg-wf-explorer
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk40 \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Restore renv library
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) {
            install.packages("renv")
          }
          renv::restore(prompt = FALSE)

      - name: Install rsconnect for deployment
        shell: Rscript {0}
        run: |
          if (!requireNamespace("rsconnect", quietly = TRUE)) {
            install.packages("rsconnect")
          }

      - name: Create required directories
        run: |
          mkdir -p _targets/user/results

      - name: Download wf_ppg_genus_plus.csv artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: wf-ppg-genus-plus-csv
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: _targets/user/results

      - name: Download wf_ppg_data_versions.csv artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: wf-ppg-data-versions-csv
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: _targets/user/results

      - name: Build app input CSVs (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: Rscript {0}
        run: |
          source("R/packages.R")
          targets::tar_make(
            names = c(wf_ppg_genus_plus_csv, wf_ppg_data_versions_csv)
          )

      - name: Deploy app via targets workflow
        shell: Rscript {0}
        run: |
          source("R/packages.R")
          targets::tar_make(
            script = "_targets_deploy.R",
            names = deploy_shiny_app
          )
